# Render Blueprint: deploys the backend API and the admin dashboard (both free).
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
services:
  - type: web
    name: smartroute-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL # paste your Neon Postgres connection string when asked
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ON_START # fill an empty database with the Vellore demo data
        value: "true"

  - type: web
    name: smartroute-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL # the hosted API above
        value: https://smartroute-api-8lxy.onrender.com
      - key: NODE_VERSION
        value: "20"
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
